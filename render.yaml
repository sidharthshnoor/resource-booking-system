services:
  - type: web
    name: resource-booking-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resource-booking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: resource-booking-client
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: resource-booking-client
    runtime: static
    rootDir: client
    buildCommand: npm install && VITE_API_URL="${BACKEND_URL}/api" npm run build
    staticPublishPath: dist
    envVars:
      - key: BACKEND_URL
        fromService:
          name: resource-booking-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: resource-booking-db
    plan: free